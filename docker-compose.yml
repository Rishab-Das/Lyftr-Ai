# Whole stack: `make up`  ->  frontend http://localhost:3000, backend http://localhost:8000
# All configuration comes from the environment (copy .env.example to .env).
services:
  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      # Pinned here so the SQLite file always lands on the named volume.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # The URL the *browser* uses to reach the backend.
      API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
