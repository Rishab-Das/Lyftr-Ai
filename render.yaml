# Render Blueprint for the backend. The frontend is a static site: deploy it on Vercel, Netlify,
# Cloudflare Pages or Render Static with root `frontend`, build `npm run build`, output `dist`,
# and the env var VITE_API_URL set to this service's URL.
services:
  - type: web
    name: llm-chat-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false            # paste the comma-separated keys in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false            # your deployed frontend origin, e.g. https://my-chat.vercel.app
      - key: LLM_MODEL
        value: gemini/gemini-3.1-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
